# Apply at the approved TLS-terminating reverse proxy. This local fragment is
# configuration guidance, not evidence that a production proxy is deployed.
server_tokens off;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Preserve the application correlation identifier and do not expose internals.
proxy_set_header X-Request-ID $http_x_request_id;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_hide_header Server;

location = /health/live {
  proxy_pass http://api;
}

location = /health/ready {
  proxy_pass http://api;
}
